name: Pytest Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      # Run every version to completion so one failure doesn't hide the others.
      fail-fast: false
      matrix:
        # requires-python is ">=3.10"; 3.12 matches the local dev env (.venv).
        # 3.13+ is out until the pandas<2.2 / numpy<2.0 pins are lifted.
        python-version: ["3.10", "3.11", "3.12"]

    env:
      # Only this matrix entry publishes the coverage badge and HTML report (artifact names must be unique).
      BADGE_PYTHON: "3.12"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@v6

    # Install the exact versions in uv.lock (what is developed and tested locally),
    # not whatever is newest on PyPI. --locked fails if uv.lock is out of date.
    - name: Install dependencies with test extras
      run: |
        uv sync --locked --extra all --python ${{ matrix.python-version }}
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

    - name: Run tests with coverage
      id: tests
      continue-on-error: true
      run: pytest tests --cov=multioutreg --cov-report=xml --cov-report=html

    - name: Generate badge
      if: ${{ matrix.python-version == env.BADGE_PYTHON && steps.tests.outcome == 'success' }}
      run: coverage-badge -o coverage.svg -f

    # Fallback badge if any earlier step failed (install or tests), so docs still build.
    # always() is needed: without it this is skipped when the install step fails.
    - name: Generate fallback badge when tests fail
      if: ${{ always() && matrix.python-version == env.BADGE_PYTHON && steps.tests.outcome != 'success' }}
      run: curl -sSL "https://img.shields.io/badge/coverage-failing-red.svg" -o coverage.svg

    # htmlcov/ may be missing if the install step failed; the badge is always there.
    - name: Upload coverage artifact
      if: ${{ always() && matrix.python-version == env.BADGE_PYTHON }}
      uses: actions/upload-artifact@v4
      with:
        name: coverage-badge
        path: |
          coverage.svg
          htmlcov/
        if-no-files-found: error

    - name: Fail workflow if tests failed
      if: ${{ steps.tests.outcome != 'success' }}
      run: exit 1
