name: Pytest Suite

on:
  push:
    branches: [main, test-cov-badge]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # python-version: ["3.10", "3.11", "3.12"]
        python-version: ["3.10"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies with test extras
      run: |
        python -m pip install --upgrade pip
        pip install .[all]

    # - name: Run tests with coverage
    #   run: |
    #     pytest tests --cov=multioutreg --cov-report=term-missing --cov-report=html

    # - name: Generate coverage badge
    #   run: |
    #     coverage-badge -o htmlcov/coverage.svg -f

    # - name: Upload HTML coverage report
    #   uses: actions/upload-artifact@v4
    #   with:
    #     name: coverage-html
    #     path: htmlcov/
    #     if-no-files-found: ignore

    - name: Run tests with coverage
      run: |
        pytest tests --cov=multioutreg --cov-report=term-missing --cov-report=html --cov-report=xml

    - name: Upload to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.xml
        fail_ci_if_error: true
        # token: ${{ secrets.CODECOV_TOKEN }}   # needed for private repos

    # - name: Run linter
    #   run: |
    #     pip install ruff
    #     ruff multioutreg

