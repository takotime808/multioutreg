name: Pytest Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # python-version: ["3.10", "3.11", "3.12"]
        python-version: ["3.10"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies with test extras
      run: |
        python -m pip install --upgrade pip
        pip install .[all]

    - name: Run tests with coverage
      id: tests
      continue-on-error: true
      run: pytest tests --cov=multioutreg --cov-report=xml

    - name: Generate badge
      if: ${{ steps.tests.outcome == 'success' }}
      run: coverage-badge -o coverage.svg -f

    # Add -99% coverage badge if tests fail, so docs still build.
    - name: Generate fallback badge when tests fail
      if: ${{ steps.tests.outcome != 'success' }}
      run: curl -sSL "https://img.shields.io/badge/coverage--99%25-red.svg" -o coverage.svg

    - name: Upload badge artifact
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: coverage-badge
        path: coverage.svg
        if-no-files-found: error

    - name: Fail workflow if tests failed
      if: ${{ steps.tests.outcome != 'success' }}
      run: exit 1
