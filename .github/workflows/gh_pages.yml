name: Documentation

on:
  workflow_run:
    workflows: ["Pytest Suite"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

jobs:
  build-docs:
    name: Build and Deploy Docs
    # A cancelled test run has no real coverage result; keep the last published site
    # (and its badge) instead of overwriting it with "failing"/"unknown".
    if: ${{ github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download coverage badge and HTML report from test workflow
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ github.event.workflow_run.id }}
          name: coverage-badge
          path: coverage-artifact

      - name: Ensure coverage badge exists
        run: |
          mkdir -p docs/_static/badges
          if [ -s coverage-artifact/coverage.svg ]; then
            cp coverage-artifact/coverage.svg docs/_static/badges/coverage.svg
          else
            curl -sSL "https://img.shields.io/badge/coverage-unknown-lightgrey.svg" -o docs/_static/badges/coverage.svg
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Pandoc
        run: sudo apt-get install -y pandoc

      - name: Install project and doc dependencies
        run: |
          pip install --upgrade pip
          pip install .[test]  # sphinx-click imports the CLI, which needs the package
          pip install sphinx \
            "sphinx-autoapi>=2.1.1" \
            sphinx-click \
            "sphinx-copybutton>=0.5.0" \
            sphinx-design \
            "sphinxcontrib-mermaid>=0.9.2" \
            "myst-parser>=2.0.0" \
            "nbsphinx>=0.9.2" \
            "furo>=2023.7.26"

      - name: Build Sphinx HTML
        working-directory: docs
        run: make html

      # Served at https://takotime808.github.io/multioutreg/coverage/ (the README badge links here).
      # coverage.py writes a .gitignore containing "*" into htmlcov/, which would stop
      # the deploy action from committing the report, so drop it.
      # If there is no report, publish a placeholder page instead of a 404, and mark the
      # badge unknown so it never shows a percentage that can't be clicked through to.
      - name: Add HTML coverage report to site
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          if [ -f coverage-artifact/htmlcov/index.html ]; then
            rm -f coverage-artifact/htmlcov/.gitignore
            cp -r coverage-artifact/htmlcov docs/build/html/coverage
          else
            mkdir -p docs/build/html/coverage
            cat > docs/build/html/coverage/index.html <<EOF
          <!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"><title>Coverage report unavailable</title></head>
          <body style="font-family: sans-serif; max-width: 40em; margin: 4em auto; padding: 0 1em;">
            <h1>Coverage report unavailable</h1>
            <p>No HTML coverage report was produced for commit <code>${HEAD_SHA}</code>.</p>
            <p>See the <a href="${RUN_URL}">test workflow run</a> for details.</p>
          </body>
          </html>
          EOF
            if ! grep -qiE 'failing|unknown' docs/build/html/_static/badges/coverage.svg; then
              curl -sSL "https://img.shields.io/badge/coverage-unknown-lightgrey.svg" -o docs/build/html/_static/badges/coverage.svg
            fi
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/build/html
          force_orphan: true
          full_commit_message: "docs: publish from ${{ github.event.workflow_run.head_sha }}"
