name: Documentation

on:
  workflow_run:
    workflows: ["Pytest Suite"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

jobs:
  build-docs:
    name: Build and Deploy Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download coverage badge from test workflow
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ github.event.workflow_run.id }}
          name: coverage-badge
          path: docs/_static/badges

      - name: Ensure coverage badge exists
        run: |
          mkdir -p docs/_static/badges
          if [ ! -s docs/_static/badges/coverage.svg ]; then
            curl -sSL "https://img.shields.io/badge/coverage--99%25-red.svg" -o docs/_static/badges/coverage.svg
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Pandoc
        run: sudo apt-get install -y pandoc

      - name: Install project and doc dependencies
        run: |
          pip install --upgrade pip
          pip install .[test]  # if test dependencies help with doc build
          pip install sphinx
          pip install sphinx_rtd_theme
          pip install sphinx-click
          pip install nbsphinx>=0.9.2
          pip install sphinxcontrib-mermaid>=0.9.2
          pip install sphinx-autoapi>=2.1.1
          pip install sphinx-copybutton>=0.5.0
          pip install myst-parser>=2.0.0
          pip install furo>=2023.7.26
          pip install jupyter-black>=0.3.4
          pip install sphinxcontrib-bibtex>=2.6.2
          pip install sphinx-gallery

      - name: Build Sphinx HTML
        working-directory: docs
        run: make html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/build/html
          force_orphan: true
          full_commit_message: "docs: publish from ${{ github.event.workflow_run.head_sha }}"
