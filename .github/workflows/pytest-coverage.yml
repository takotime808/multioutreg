name: CI/CD with Coverage Badge

on:
  push:
    branches:
      - main
      - test-cov-badge
    paths-ignore:
      # Prevents infinite loop if the action commits the badge to the main branch
      - '**/coverage.svg' 
  pull_request:
    branches:
      - main
      - test-cov-badge

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit the badge file
      pull-requests: write # Needed for PR comments (if using a relevant action)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          # pip install pytest pytest-cov
          # # Install your project's dependencies
          # # pip install -r requirements.txt
          pip install .[all]

      - name: Run tests with coverage
        run: |
          # Generate the .coverage data file and other reports if needed
          pytest --cov=multioutreg --cov-report=xml --cov-report=html

      - name: Generate coverage badge
        # Use an action like tj-actions/coverage-badge-py to create a coverage.svg file
        uses: tj-actions/coverage-badge-py@v2 
        with:
          output: docs/badges/coverage.svg

      - name: Commit and push badge
        uses: EndBug/add-and-commit@v9
        with:
          # Commits the generated badge file back to the repo
          files: docs/badges/coverage.svg 
          message: 'docs(ci): update coverage badge'
          add: 'docs/badges/coverage.svg'
        env:
          # Use the default GitHub token for this
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
