[project]
name = "multioutreg"
version = "0.0.1"
description = "Multi-Output Regressors"
readme = "README.md"
requires-python = ">=3.10"
# authors = [
#     {name = "takotime808", email = "takotime808"},
# ]
license = {file = "LICENSE"}

dependencies = [
  "typer-cli", # ==0.12.0, 0.16.0
  "wasabi",
  "termcolor",
  "pyfiglet",
  "terminology",
  # "numpy>=1.22,<2.0",
  # "pandas>=1.5,<2.2",
  "matplotlib>=3.5,<4.0",
  "scikit-learn>=1.2",
  "seaborn>=0.13.0,<=0.13.2",
  "uncertainty-toolbox",#>=0.1.4,<0.1.7",
  "shap>=0.48.0",
  # "jinja2>=3.0",
  "umap-learn",
  # "kaleido",
  "nbformat>=4.2.0",
  # "ray[tune]>=2.30",
  # "hyperopt>=0.2",
  # "textual",
  "streamlit",
  # ----- Below this line are duplicates from [ts] below...this is necessary for the
  "chronos-forecasting>=1.5.0",
  "torch>=2.1",
  "pandas>=2.0,<2.2", #==2.1.4
  "numpy>=1.26,<2.0", # ==1.26.4
  "statsmodels",
]

[project.optional-dependencies]
ts = [
  # provides BaseChronosPipeline / ChronosPipeline
  "chronos-forecasting>=1.5.0",
  "torch>=2.1",
  # These may clash with normal dependencies.
  "pandas>=2.0,<2.2",
  "numpy>=1.26,<2.0"
]
ngboost = [
  "ngboost",
  # ngboost 0.5.8 requires sklearn>=1.6 (uses ensure_all_finite added in 1.6)
  "scikit-learn>=1.6",
]
xgboost = [
  # Used by surrogate(s): XGBoostSurrogate
  "xgboost",
]
lightgbm = [
  # Used by surrogate(s): LightGBMSurrogate
  "lightgbm",
]
catboost = [
  # Used by surrogate(s): CatBoostSurrogate
  "catboost",
]
gpytorch = [
  # Used by surrogate(s): SparseGPSurrogate
  "gpytorch",
]
smt = [
  # Used by surrogate(s): KPLSSurrogate, GPXSurrogate
  "smt[gpx]",
]
test = [
    "pytest",
    "pytest-cov",
    "pytest-sugar",
    # "pytest-xdist",
    "coverage-badge",
]
all = [
  "multioutreg[ts,ngboost,xgboost,lightgbm,catboost,gpytorch,smt,test]",
]

[tool.setuptools.packages.find]
where = [".", "mor_cli", "multioutreg"]
namespaces = false

# Include html files in wheel distribution -- NO need for Manifest.in
[tool.setuptools.package-data]
"multioutreg.report" = ["*.html"]

[project.scripts]
multioutreg = "mor_cli:main"

[build-system]
requires = ["setuptools>=43.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.coverage.run]
omit = [
    "*/Deploy/*",
    "*/docs/*",
    "*/examples/*",
    "*/tests/*",        # Excludes any files within "tests" directories
]
[tool.coverage.report]
exclude_lines = [
    'except Exception:',
    'pass',
    'plt.show()',
    # "except Exception:",
    # "plt\\.show\\(\\)",
]

# [tool.pytest.ini_options]
# addopts = "-v"  # Run tests in verbose mode
# testpaths = [
#     "tests"
# ]
