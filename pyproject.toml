[project]
name = "multioutreg"
version = "0.0.1"
description = "Multi-Output Regressors"
readme = "README.md"
requires-python = ">=3.10"
# authors = [
#     {name = "takotime808", email = "takotime808"},
# ]
license = {file = "LICENSE"}

dependencies = [
  "typer-cli", # ==0.12.0, 0.16.0
  "wasabi",
  "termcolor",
  "pyfiglet",
  "terminology",
  # "numpy>=1.22,<2.0",
  # "pandas>=1.5,<2.2",
  "matplotlib>=3.5,<4.0",
  "scikit-learn>=1.4",  # root_mean_squared_error was added in 1.4 (previously was 1.2)
  "seaborn>=0.13.0,<=0.13.2",
  "uncertainty-toolbox",#>=0.1.4,<0.1.7",
  "shap>=0.48.0",
  "jinja2>=3.0",
  "umap-learn>=0.5.8",  # older releases break on scikit-learn>=1.8 (force_all_finite) # no version previously specified
  # "kaleido",
  "nbformat>=4.2.0",
  # "ray[tune]>=2.30",
  # "hyperopt>=0.2",
  # "textual",
  "streamlit>=1.50",  # width="stretch" replaces deprecated use_column_width
  # ----- Below this line are duplicates from [ts] below...this is necessary for the
  "chronos-forecasting>=1.5.0",
  "torch>=2.1",
  "pandas>=2.0,<2.2", #==2.1.4
  "numpy>=1.26,<2.0", # ==1.26.4
  # pyarrow (pulled in by streamlit) requires NumPy 2 from 26.0; its metadata doesn't say so.
  "pyarrow<26",
  "statsmodels",
  "joblib",
  # "typing-extensions", # sub-dep of other package
  "pyyaml",
  "scipy",
]

[project.optional-dependencies]
ts = [
  # provides BaseChronosPipeline / ChronosPipeline
  "chronos-forecasting>=1.5.0",
  "torch>=2.1",
  # These may clash with normal dependencies.
  "pandas>=2.0,<2.2",
  "numpy>=1.26,<2.0",
  "boto3",
  "python-dotenv",
]
ngboost = [
  "ngboost",
  # ngboost 0.5.8 requires sklearn>=1.6 (uses ensure_all_finite added in 1.6)
  "scikit-learn>=1.6",
]
xgboost = [
  # Used by surrogate(s): XGBoostSurrogate
  "xgboost",
]
lightgbm = [
  # Used by surrogate(s): LightGBMSurrogate
  "lightgbm",
]
catboost = [
  # Used by surrogate(s): CatBoostSurrogate
  "catboost",
]
gpytorch = [
  # Used by surrogate(s): SparseGPSurrogate
  "gpytorch",
]
smt = [
  # Used by surrogate(s): KPLSSurrogate, GPXSurrogate
  "smt[gpx]",
]
lstm = [
  "keras",
]
prophet = [
  # Used by ProphetForecaster
  "prophet>=1.1",
]
neuralforecast = [
  # Used by NeuralForecaster (N-BEATS / N-HiTS)
  "neuralforecast>=1.7",
]
moo = [
  # Optional fast exact hypervolume for >2 objectives in multioutreg.metrics
  # (falls back to exact 1D/2D or Monte Carlo without it).
  "pymoo>=0.6.1",
]
test = [
    "pytest",
    "pytest-cov",
    "pytest-sugar",
    # "pytest-xdist",
    "coverage-badge",
    # coverage-badge imports pkg_resources, which setuptools>=81 no longer ships.
    "setuptools<81",
]
all = [
  # Every optional *library* feature plus the test tooling. `examples` is
  # deliberately excluded: ray/hyperopt/plotly are only used by the example
  # notebooks, never by the package. Use `multioutreg[all,examples]` for those.
  "multioutreg[ts,ngboost,xgboost,lightgbm,catboost,gpytorch,smt,lstm,prophet,neuralforecast,moo,test]",
]
examples = [
  "ray",
  "hyperopt",
  "plotly",
]


[tool.uv]
# torch >= 2.3 and llvmlite >= 0.44 publish no wheels for Intel macOS, so the
# lockfile is unsatisfiable there without these platform-specific caps.
constraint-dependencies = [
  "torch<2.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "llvmlite<0.44; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "numba<0.61; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[tool.setuptools.packages.find]
where = [".", "mor_cli", "multioutreg"]
namespaces = false

# Include html files in wheel distribution -- NO need for Manifest.in
[tool.setuptools.package-data]
"multioutreg.report" = ["*.html"]

[project.scripts]
multioutreg = "mor_cli:main"

[build-system]
requires = ["setuptools>=43.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.coverage.run]
omit = [
    "*/Deploy/*",
    "*/docs/*",
    "*/examples/*",
    "*/tests/*",        # Excludes any files within "tests" directories
]
[tool.coverage.report]
exclude_lines = [
    'except Exception:',
    'pass',
    'plt.show()',
    # "except Exception:",
    # "plt\\.show\\(\\)",
]

# [tool.pytest.ini_options]
# addopts = "-v"  # Run tests in verbose mode
# testpaths = [
#     "tests"
# ]
